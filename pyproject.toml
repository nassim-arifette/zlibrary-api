[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zlib-connector"
version = "0.1.0"
description = "Search Z-Library, choose an edition and download books from your terminal or Python."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zlib-cli = "zlib_connector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zlib_connector*"]
