[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zlib-connector"
version = "0.1.0"
description = "Z-Library API, CLI and TUI for search, downloads, favorites and booklists. Python API and CLI available; TUI and HTTP API planned."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zlib-cli = "zlib_connector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zlib_connector*"]
