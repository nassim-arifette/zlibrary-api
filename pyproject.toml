[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zlib-connector"
version = "0.1.0"
description = "Z-Library Python API, HTTP API, CLI and collections TUI for search, downloads and personal collections."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tui = ["textual==8.2.8"]

[project.scripts]
zlib-cli = "zlib_connector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zlib_connector*"]
